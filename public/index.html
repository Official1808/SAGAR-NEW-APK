<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PW SARA Security Gateway</title>
  <style>
    body {
      background: radial-gradient(circle at top, #1e293b, #0b0c10);
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background-color: rgba(22, 25, 34, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid #232734;
      border-radius: 20px;
      padding: 40px 32px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }
    .logo {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      font-size: 30px;
      box-shadow: 0 8px 16px rgba(59, 130, 246, 0.3);
    }
    h1 {
      font-size: 24px;
      margin: 0 0 8px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 600;
      padding: 5px 14px;
      border-radius: 20px;
      background: rgba(34, 197, 94, 0.15);
      color: #22c55e;
      border: 1px solid rgba(34, 197, 94, 0.3);
      margin-bottom: 20px;
    }
    .dot {
      width: 8px;
      height: 8px;
      background-color: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 8px #22c55e;
    }
    p {
      color: #9ca3af;
      font-size: 15px;
      line-height: 1.6;
      margin: 0 0 24px;
    }
    .endpoints {
      background: #0f1117;
      border: 1px solid #1f2430;
      border-radius: 12px;
      padding: 16px;
      text-align: left;
      font-family: monospace;
      font-size: 13px;
      color: #60a5fa;
    }
    .endpoints div {
      margin-bottom: 8px;
    }
    .endpoints div:last-child {
      margin-bottom: 0;
    }
    .method {
      color: #34d399;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🛡️</div>
    <div class="status-badge"><span class="dot"></span> Gateway Server Online</div>
    <h1>PW SARA Cloud Gateway</h1>
    <p>Real-time webhook and status polling server for PW SARA Gate Android Security application.</p>
    
    <div class="endpoints">
      <div><span class="method">GET</span> /api/action?action=approve&username=...</div>
      <div><span class="method">GET</span> /api/check-status?username=...</div>
    </div>
  </div>
</body>
</html>
